[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "banglishnlp"
version = "0.1.0"
description = "A Python library for Bangla-English code-mixed text processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["banglishnlp*"]
